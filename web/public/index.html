<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime 变量管理</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="home-view" class="page">
      <section class="card form-card">
        <h1>Runtime 变量集合</h1>
        <p class="subtitle">首页展示多个变量集合，点击进入后可独立管理每个集合。</p>

        <form id="collection-form" class="collection-form">
          <label>
            新建变量集合
            <input id="collection-name" name="collection-name" placeholder="例如：订单结算规则" required />
          </label>
          <div class="form-actions">
            <button id="create-collection-btn" type="submit" class="secondary">创建集合</button>
            <a class="button-link" href="/front-only.html">前端独立模式页面</a>
          </div>
        </form>
      </section>

      <section class="card table-card">
        <h2>变量集合列表</h2>
        <table>
          <thead>
            <tr>
              <th>集合名</th>
              <th>变量数量</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="collections-body"></tbody>
        </table>
      </section>
    </main>

    <main id="manager-view" class="page" hidden>
      <section class="card form-card">
        <div class="page-head">
          <button id="back-home-btn" type="button" class="ghost">返回首页</button>
          <span id="current-collection" class="mode-badge">集合: -</span>
        </div>

        <h1>Runtime 变量管理</h1>
        <p class="subtitle">输入变量名、输入参数和变量值/计算式，支持后台结算与前端 Runtime 结算双模式。</p>

        <div class="mode-switch" role="group" aria-label="结算模式">
          <button id="mode-backend-btn" type="button" class="secondary">后台结算模式</button>
          <button id="mode-local-btn" type="button" class="ghost">前端 Runtime 模式</button>
          <span id="mode-badge" class="mode-badge">当前: 后台结算</span>
        </div>

        <form id="variable-form" class="variable-form">
          <label>
            变量名
            <input id="name" name="name" placeholder="例如：sum" required />
          </label>

          <label>
            输入参数（逗号分隔，可选）
            <input id="params" name="params" placeholder="例如：a, b" />
          </label>

          <label>
            变量参数 params（键值对，可选）
            <input id="option-params" name="option-params" placeholder="例如：p1:p1Value, p2:p2Value" />
          </label>

          <label>
            值 / 函数 / 计算式
            <textarea id="expression" name="expression" rows="4" placeholder="例如：a + b" required></textarea>
          </label>

          <div class="form-actions">
            <button id="submit-btn" type="submit">+</button>
            <button id="cancel-btn" type="button" class="ghost" hidden>取消编辑</button>
            <button id="show-values-btn" type="button" class="secondary">查看当前所有变量和值</button>
            <button id="show-values-async-btn" type="button" class="secondary">异步显示当前所有变量和值</button>
            <button id="csv-import-btn" type="button" class="ghost">CSV导入</button>
            <input id="csv-file" type="file" accept=".csv,text/csv" hidden />
            <button id="object-import-btn" type="button" class="ghost">导入对象</button>
            <input id="object-import-file" type="file" accept=".txt,text/plain" hidden />
            <button id="save-btn" type="button" class="secondary" hidden>保存到后台</button>
            <button id="export-btn" type="button" class="ghost">导出 JSON</button>
            <button id="import-btn" type="button" class="ghost">导入 JSON</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden />
          </div>
        </form>
      </section>

      <section class="card table-card">
        <h2>变量列表</h2>
        <table>
          <thead>
            <tr>
              <th>变量名</th>
              <th>输入参数</th>
              <th>params</th>
              <th>值 / 计算式</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="variables-body"></tbody>
        </table>
      </section>

      <section class="card values-card">
        <h2>当前所有变量和值</h2>
        <pre id="values-output">点击“查看当前所有变量和值”加载</pre>
      </section>
    </main>

    <template id="empty-row-template">
      <tr>
        <td colspan="5" class="empty-row">暂无变量</td>
      </tr>
    </template>

    <template id="empty-collection-row-template">
      <tr>
        <td colspan="3" class="empty-row">暂无变量集合</td>
      </tr>
    </template>

    <dialog id="import-preview-dialog" class="preview-dialog">
      <form method="dialog" class="preview-panel">
        <header class="preview-header">
          <h3>导入预览</h3>
          <button id="preview-close-btn" type="button" class="ghost">关闭</button>
        </header>

        <div id="preview-summary" class="preview-summary"></div>

        <div class="preview-grid">
          <section>
            <h4>将新增</h4>
            <div id="preview-created" class="preview-list"></div>
          </section>
          <section>
            <h4>将覆盖</h4>
            <div id="preview-updated" class="preview-list"></div>
          </section>
          <section>
            <h4>将删除</h4>
            <div id="preview-removed" class="preview-list"></div>
          </section>
          <section>
            <h4>不变</h4>
            <div id="preview-unchanged" class="preview-list"></div>
          </section>
        </div>

        <footer class="preview-actions">
          <button id="preview-copy-btn" type="button" class="ghost">复制预览</button>
          <button id="preview-cancel-btn" type="button" class="ghost">取消</button>
          <button id="preview-confirm-btn" type="button" class="secondary">确认导入</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/app-unified.js"></script>
  </body>
</html>
